# Global Academy Market — Netlify config. Static site, no build step.
[build]
  publish = "."
  command = ""

# Security headers for every page
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

# Shared CSS and logo: cache for a day (file names aren't versioned)
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=86400"

# The example guide is a template: never index it
[[headers]]
  for = "/guides/example-guide/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

# Old or mistyped links to /guides go to the catalog
[[redirects]]
  from = "/guides"
  to = "/#guides"
  status = 301

# Keep README, credits and config files private
[[redirects]]
  from = "/CREDITS.md"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/README.md"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/netlify.toml"
  to = "/404.html"
  status = 404
  force = true
